    <h1>我的家乡</h1>
    <p>我的家乡个旧，同时因锡矿储量丰富而被称为"世界锡都"，位于云南省红河哈尼族彝族自治州。</p>
    <h2>遍地美食，酸辣鲜香</h2>
    <p>个旧遍地都是美食，本地人大部分都偏酸辣口，越吃越上瘾。走在街头巷尾，到处都能遇到令人垂涎欲滴的小吃。</p>
     <ul>
      <li>糖粉小肉串：个旧最出名的小吃，外焦里嫩，撒上糖粉，甜与辣流连味蕾。</li>
      <li>小锅米线：酸辣开胃，汤鲜料足，是本地人的日常最爱，一日不吃甚是想念。</li>
      <li>烧豆腐：炭火烤得鼓胀，蘸上自己搭配的碟子，香气扑鼻。</li>
      <li>凉卷粉：酸辣爽滑，配上花生碎和辣子油，一口令人满足。</li>
    </ul>
